<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Sarthak Atlasia about software engineering opportunities, projects, and collaborations.">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Contact | Sarthak Atlasia</title>
</head>

<body>
  
    <div class="container">
      <div class="sidebar sidebargo" >
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="intro.html">Skills</a></li>
                    <li><a href="services.html">About</a></li>
                    <li><a href="contact.html">Contact Me</a></li>
                    
                </ul>
            </nav>
        </div>
        <div class="main">
          <div class="hamburger" role="button" tabindex="0" aria-label="Toggle navigation menu">
            <img class="ham" src="images/hamburger.png" alt="Open navigation menu" width="30">
            <img class="cross" src="images/cross.png" alt="Close navigation menu" width="30">
        </div>
            <div class="contactform">
                <h1>Contact for Work/Enquires</h1>
                <form action="https://formspree.io/f/xaygnppj" method="POST">
                    <div class="mb-3">
                        <label for="clientname" class="form-label">Name</label>
                        <input type="text" class="form-control" id="clientname" name="name" required>
                        
                      </div>
                    <div class="mb-3">
                      <label for="useremail" class="form-label">Your Email</label>
                      <input type="email" class="form-control" id="useremail" name="_replyto" aria-describedby="emailHelp" required>
                      <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    <div class="mb-3">
                      <label for="clientphone" class="form-label">Phone No.</label>
                      <input type="tel" class="form-control" id="clientphone" name="phone">
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject </label>
                        <input type="text" class="form-control" id="subject" name="_subject">
                        <label for="message" class="form-label">Message </label>
                        <textarea id="message" name="message" required></textarea>
                       </div>
                    <div class="mb-3" id="form-check">
                      <input type="checkbox" class="form-check-input" id="isclient">
                      <label class="form-check-label" for="isclient">Work on a project with me</label>
                    </div>
                    
                    <p id="form-status" role="status" aria-live="polite"></p>
                    <button type="submit" class="btn btn-sm">Submit</button>
                  </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
